<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard - Haal Khabar</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: #111827;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h2 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 20px;
      color: #38bdf8;
    }

    .form-group {
      margin-bottom: 15px;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1f2937;
      color: #fff;
      outline: none;
    }

    input[type="text"]::placeholder {
      color: #9ca3af;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      border: none;
      border-radius: 8px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #0ea5e9;
      transform: scale(1.02);
    }

    .footer {
      text-align: center;
      margin-top: 15px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>📰 Upload News</h2>

    <form id="newsForm">
      <div class="form-group">
        <input type="text" id="title" placeholder="Enter News Title" required />
      </div>

      <div class="form-group">
        <input type="file" id="image" required />
      </div>

      <button type="submit">Upload News</button>
    </form>

    <div class="footer">
      Haal Khabar Admin Panel
    </div>
  </div>

  <script src="js/admin.js"></script>

</body>
</html>
